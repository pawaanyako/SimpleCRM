services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=orders
      - POSTGRES_PASSWORD=orders_pass
      - POSTGRES_DB=orders_db
    ports:
      - "5432:5432"
    volumes:
      - orders_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orders_pgdata: